services:
  # Backend API Service (Self-Contained Semantic Matching Engine)
  - type: web
    name: unthinkable-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./screener.db
      - key: LLM_PROVIDER
        value: built_in
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'

  # Frontend Web Service (Global CDN Static Site)
  - type: web
    name: unthinkable-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/api/*"
        destination: "https://unthinkable-backend.onrender.com/api/*"
      - type: rewrite
        source: "/*"
        destination: "/index.html"
