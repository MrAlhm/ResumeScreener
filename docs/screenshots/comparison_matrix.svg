  <text x="70" y="37" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Smart Resume Screener</text>
  <text x="1018" y="37" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold">REAL-TIME ENGINE</text>

