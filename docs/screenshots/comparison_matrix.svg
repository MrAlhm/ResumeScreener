  <line x1="268" y1="524" x2="1176" y2="524" stroke="#f1f5f9"/>
  <text x="292" y="552" fill="#334155" font-family="sans-serif" font-size="11" font-weight="bold">Core Skills</text>
  <text x="500" y="552" fill="#047857" font-family="sans-serif" font-size="10">Python, SQL, PyTorch, AWS</text>
  <text x="730" y="552" fill="#047857" font-family="sans-serif" font-size="10">Python, FastAPI, Docker, SQL</text>
  <text x="960" y="552" fill="#047857" font-family="sans-serif" font-size="10">Python, Scikit-learn, SQL</text>

