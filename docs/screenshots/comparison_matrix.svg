  <rect x="268" y="160" width="908" height="180" rx="16" fill="#0f172a" stroke="#1e293b"/>
  <text x="292" y="186" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">COMPETENCY RADAR OVERLAY</text>
  <!-- Mock Radar Polygon -->
  <polygon points="722,210 770,240 755,300 690,300 670,240" fill="#2dd4bf" fill-opacity="0.3" stroke="#2dd4bf" stroke-width="2"/>
  <polygon points="722,225 760,250 740,290 700,290 685,250" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
  <text x="400" y="235" fill="#2dd4bf" font-family="sans-serif" font-size="12" font-weight="bold">■ Aarav Sharma (Lead ML)</text>
  <text x="400" y="260" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">■ Priya Reddy (Senior Backend &amp; ML)</text>
  <text x="400" y="285" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold">■ Rahul Verma (Data Scientist)</text>

  <!-- Comparison Matrix Table -->
  <rect x="268" y="352" width="908" height="304" rx="16" fill="#ffffff"/>
  <rect x="268" y="352" width="908" height="40" rx="16" fill="#f8fafc"/>
  <text x="292" y="377" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="bold">EVALUATION DIMENSION</text>
