  <text x="500" y="508" fill="#0f172a" font-family="sans-serif" font-size="11">5.0 Years (19.5/20)</text>
  <text x="730" y="508" fill="#0f172a" font-family="sans-serif" font-size="11">4.0 Years (18.0/20)</text>
  <text x="960" y="508" fill="#0f172a" font-family="sans-serif" font-size="11">2.5 Years (15.0/20)</text>

