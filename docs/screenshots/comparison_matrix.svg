  <text x="730" y="377" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Priya Reddy</text>
  <text x="960" y="377" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="bold">Rahul Verma</text>

