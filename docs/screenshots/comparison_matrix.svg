  <text x="500" y="596" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="bold">✓ Shortlisted</text>
  <text x="730" y="596" fill="#065f46" font-family="sans-serif" font-size="11" font-weight="bold">✓ Shortlisted</text>
  <text x="960" y="596" fill="#92400e" font-family="sans-serif" font-size="11" font-weight="bold">⏱ In Review</text>
